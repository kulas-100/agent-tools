# Smithery.ai MCP Server Manifest
# https://smithery.ai — The Model Context Protocol Marketplace

name: agenttools
displayName: "AgentTools — Enterprise AI Agent Suite & Invoice Intelligence"
version: "1.1.0"
description: >
  High-value MCP tools for Claude Desktop, Cursor, and Windsurf:
  Financial & invoice extraction with math verification, PDF document
  intelligence with token budgets, token-efficient Markdown web scraping,
  live search, news, and weather. Zero third-party API keys required.

author: "kulas-100"
homepage: "https://github.com/kulas-100/agent-tools"
license: MIT

# How to start this MCP server
startCommand:
  type: stdio
  command: python
  args: ["mcp_server.py"]
  env:
    PYTHONPATH: "."

# Tool manifest — describes each tool for MCP client discovery
tools:
  - name: invoice_extract
    description: "Extract structured financial data from invoices and receipts (vendor, invoice #, line items, totals, dates, tax with math verification)"
    inputSchema:
      type: object
      properties:
        url:
          type: string
          description: "URL to invoice PDF or receipt image"
        file_base64:
          type: string
          description: "Base64-encoded invoice file"
        raw_text:
          type: string
          description: "Raw invoice text if already available"
        currency_hint:
          type: string
          description: "Default currency code fallback (e.g. USD, EUR)"
          default: "USD"

  - name: pdf_extract
    description: "Extract structured text per page, metadata, and estimated token counts from a PDF document (via URL or Base64)"
    inputSchema:
      type: object
      properties:
        url:
          type: string
          description: "Direct URL of the PDF"
        file_base64:
          type: string
          description: "Base64-encoded PDF binary"
        max_pages:
          type: integer
          description: "Maximum pages to extract (default 15)"
          default: 15
        start_page:
          type: integer
          description: "Starting page number (default 1)"
          default: 1

  - name: web_reader
    description: "Fetch any public webpage URL and extract clean, structured Markdown optimized for LLM token efficiency"
    inputSchema:
      type: object
      properties:
        url:
          type: string
          description: "The full URL to fetch"
        max_length:
          type: integer
          description: "Max markdown length (default 15000)"
          default: 15000
        include_links:
          type: boolean
          description: "Whether to return page links catalog"
          default: false
      required: [url]

  - name: web_search
    description: "Search the web using DuckDuckGo and return structured results"
    inputSchema:
      type: object
      properties:
        query:
          type: string
          description: "Search query string"
        max_results:
          type: integer
          description: "Number of results (1-20, default 5)"
          default: 5
      required: [query]

  - name: get_weather
    description: "Get current weather and multi-day forecast for any location worldwide"
    inputSchema:
      type: object
      properties:
        location:
          type: string
          description: "City or place name (e.g. 'London', 'New York')"
        forecast_days:
          type: integer
          description: "Forecast days (1-7, default 3)"
          default: 3
      required: [location]

  - name: get_news
    description: "Fetch latest news headlines and summaries for any topic"
    inputSchema:
      type: object
      properties:
        topic:
          type: string
          description: "News topic or keyword"
        max_articles:
          type: integer
          description: "Number of articles (1-20, default 5)"
          default: 5
      required: [topic]

  - name: summarize
    description: "Summarize long text into key sentences using extractive summarization"
    inputSchema:
      type: object
      properties:
        text:
          type: string
          description: "Text to summarize (max 50,000 chars)"
        num_sentences:
          type: integer
          description: "Number of output sentences (1-10, default 3)"
          default: 3
      required: [text]

  - name: get_ip_info
    description: "Get geolocation and ISP metadata for an IP address"
    inputSchema:
      type: object
      properties:
        ip:
          type: string
          description: "IP address (leave blank for your own IP)"
