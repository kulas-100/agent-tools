services:
  - type: web
    name: agenttools-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEFAULT_API_KEY
        value: test-api-key-12345
      - key: DB_PATH
        value: agent_api.db
