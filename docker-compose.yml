version: "3.9"

services:
  api:
    build: .
    container_name: agenttools-api
    ports:
      - "8000:8000"
    environment:
      - DEFAULT_API_KEY=${DEFAULT_API_KEY:-test-api-key-12345}
      - MASTER_API_KEY=${MASTER_API_KEY:-change-me}
      - DB_PATH=/data/agent_api.db
    volumes:
      - api_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  api_data:
    driver: local
